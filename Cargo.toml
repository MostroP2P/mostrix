[package]
name = "mostrix"
version = "0.3.8"
rust-version = "1.97.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["Francisco Calderón <negrunch@grunch.dev>"]
description = "Mostro TUI client"

[dependencies]
# `unstable-rendered-line-info`: `Paragraph::line_count` to clamp scroll over wrapped rows.
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
# Matrix only — render into ratatui cells ourselves (no `image` crate).
qrcode = { version = "0.15.0", default-features = false }
mostro-core = "0.17.4"
nostr-sdk = { version = "0.45.6" }
# Enable NIP features on `nostr` (re-exported via nostr-sdk::prelude). nip06 is
# required for Keys::from_mnemonic_*; nip44 for protocol DMs and kind-14 chat.
nostr = { version = "0.45.7", default-features = false, features = [
  "std",
  "nip06",
  "nip44",
] }
bip39 = { version = "3.0.0", features = ["rand"] }
sqlx = { version = "0.9.1", features = [
  "runtime-tokio",
  "tls-rustls-ring",
  "sqlite",
  "macros",
  "chrono",
  "uuid",
] }
tokio = { version = "1.54.1", features = ["full"] }
chrono = "0.4.45"
futures = "0.3.34"
anyhow = "1.0.105"
dirs = "7.0.0"
fern = "0.7.1"
log = "0.4.35"
config = { version = "0.15.27", features = ["toml"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.3"
base64 = "0.23.1"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
lightning-invoice = { version = "0.34.2", features = ["std"] }
lnurl-rs = { version = "0.11.0", default-features = false, features = ["ureq"] }
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
libc = "0.2.191"
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls-no-provider",
  "json",
  "http2",
] }
rustls = { version = "0.23.46", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
chacha20poly1305 = "0.11.0"
sha2 = "0.11.2"
hex = "0.4"
tui-scrollview = "0.6.8"
ratatui-explorer = "0.3.0"
zeroize = "1.9.2"
unicode-segmentation = "1.13.3"

[package.metadata.release]
publish = false
push = true
verify = true
tag = true
sign-commit = true
sign-tag = true
allow-branch = ["main"]
pre-release-hook = [
  "sh",
  "-c",
  "cargo fmt --all && cargo clippy --all-targets --all-features -- -D warnings && if [ -n \"${GITHUB_TOKEN:-}\" ]; then GITHUB_TOKEN=\"$GITHUB_TOKEN\" git cliff --unreleased --github-repo MostroP2P/mostrix -o CHANGELOG.md --tag {{version}}; else git cliff --unreleased -o CHANGELOG.md --tag {{version}}; fi && if [ \"$DRY_RUN\" != \"true\" ]; then git diff --quiet CHANGELOG.md || (git add CHANGELOG.md && git commit -m \"Update CHANGELOG for version {{version}}\"); else echo \"DRY RUN: Skip git add and commit\"; fi",
]
