name: Build and Release for all targets

on:
  push:
    tags: ['v*.*.*']          # run only when a tag like v1.2.3 is pushed
  workflow_dispatch:

# Default to read-only; the `release` job opts into `contents: write` to publish.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Read changelog (generated locally by cargo-release pre-hook)
  changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      content: ${{ steps.read-changelog.outputs.content }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read changelog from committed file
        id: read-changelog
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "Warning: CHANGELOG.md not found, using empty changelog"
            echo "content=" >> $GITHUB_OUTPUT
          else
            echo "content<<EOF" >> $GITHUB_OUTPUT
            cat CHANGELOG.md >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

  # Test the code
  test:
    runs-on: ubuntu-latest
    needs: changelog
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with: { cache-on-failure: true }
      - name: cargo test
        run: cargo test --all-features --locked

  # Prepare matrix of targets from archs file (os + whether to use cross)
  matrix:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      targets: ${{ steps.set-matrix.outputs.targets }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: set-matrix
        name: Read targets from archs
        shell: bash
        run: |
          set -euo pipefail
          # Windows MSVC must build on windows-latest (native); Apple targets must build on
          # macos-latest (the Apple SDK cannot be redistributed in a cross image, and it ships
          # both arm64 and x86_64 slices, so one runner covers both Darwin triples).
          # Everything else uses cross on Ubuntu.
          # windows-gnu via cross is avoided: MinGW ld in the cross image rejects LLVM
          # -exclude-symbols .drectve directives from modern Rust (link failure).
          targets=$(
            grep -v '^\s*$' archs | while read -r t; do
              case "$t" in
                *-pc-windows-msvc)
                  jq -nc --arg t "$t" '{target:$t,os:"windows-latest",use_cross:false}'
                  ;;
                *-pc-windows-*)
                  echo "Unsupported Windows target in archs (use x86_64-pc-windows-msvc): $t" >&2
                  exit 1
                  ;;
                *-apple-darwin)
                  jq -nc --arg t "$t" '{target:$t,os:"macos-latest",use_cross:false}'
                  ;;
                *)
                  jq -nc --arg t "$t" '{target:$t,os:"ubuntu-latest",use_cross:true}'
                  ;;
              esac
            done | jq -s -c .
          )
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  # Build binaries for all targets (cross on Linux, native cargo on Windows MSVC and macOS)
  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.targets) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: release-${{ matrix.target }}

      - name: Cache cross binary
        if: matrix.use_cross
        id: cache-cross
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cross
          key: cross-${{ runner.os }}-0.2.5

      - name: Install cross (pinned version for reproducibility)
        if: matrix.use_cross && steps.cache-cross.outputs.cache-hit != 'true'
        run: cargo install cross --version 0.2.5

      - name: Build release (cross)
        if: matrix.use_cross
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Build release (native)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare conventional artifact name
        shell: bash
        run: |
          set -euo pipefail
          outdir="artifacts"
          mkdir -p "$outdir"
          case "${{ matrix.target }}" in
            *-pc-windows-*) src="target/${{ matrix.target }}/release/mostrix.exe"; dst="$outdir/mostrix-${{ matrix.target }}.exe";;
            *)              src="target/${{ matrix.target }}/release/mostrix";     dst="$outdir/mostrix-${{ matrix.target }}";;
          esac
          cp "$src" "$dst"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.target }}
          path: artifacts/*

  # Create release with all artifacts
  release:
    runs-on: ubuntu-latest
    needs: [changelog, build]
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate checksums manifest
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          # Compute SHA256 for all produced binaries
          : > manifest.txt
          for f in $(ls -1 artifact-*/mostrix* | sort); do
            sha256sum "$f" >> manifest.txt
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ needs.changelog.outputs.content }}
          files: |
            artifact-*/mostrix*
            manifest.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
