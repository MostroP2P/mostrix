# Manual Windows release binary for any branch/PR.
# Uploads an Actions artifact only — never creates a GitHub Release / Latest tag.
name: Build Windows artifact

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WINDOWS_TARGET: x86_64-pc-windows-msvc

jobs:
  windows-release:
    name: windows release binary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ env.WINDOWS_TARGET }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: windows-artifact-${{ env.WINDOWS_TARGET }}

      - name: cargo build --release
        run: cargo build --release --locked --all-features --target ${{ env.WINDOWS_TARGET }}

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp "target/${WINDOWS_TARGET}/release/mostrix.exe" \
            "artifacts/mostrix-${WINDOWS_TARGET}.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: mostrix-windows-msvc
          path: artifacts/mostrix-*.exe
          if-no-files-found: error
          retention-days: 14
